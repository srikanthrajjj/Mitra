    <circle cx="18" cy="18" r="8" fill="#6B1F5E"/>
    <circle cx="39" cy="18" r="8" fill="#8E2070"/>
    <circle cx="61" cy="18" r="8" fill="#A8236F"/>
    <circle cx="82" cy="18" r="8" fill="#5A1A52"/>

    <circle cx="18" cy="39" r="8" fill="#8E2070"/>
    <circle cx="39" cy="39" r="8" fill="#B02A6B"/>
    <circle cx="61" cy="39" r="8" fill="#C7305F"/>
    <circle cx="82" cy="39" r="8" fill="#8E2070"/>

    <circle cx="18" cy="61" r="8" fill="#A8236F"/>
    <circle cx="39" cy="61" r="8" fill="#C7305F"/>
    <circle cx="61" cy="61" r="8" fill="#D93A4F"/>
    <circle cx="82" cy="61" r="8" fill="#A8236F"/>

    <circle cx="18" cy="82" r="8" fill="#4A1746"/>
    <circle cx="39" cy="82" r="8" fill="#8E2070"/>
    <circle cx="61" cy="82" r="8" fill="#B02A6B"/>
    <circle cx="82" cy="82" r="8" fill="#D93A4F"/>
